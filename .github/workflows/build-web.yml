name: Build and Push Web

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      working-directory: web
      run: |
        docker build \
          --platform linux/amd64 \
          --build-arg NEXT_PUBLIC_AUDIO_BASE_URL=https://persian-tts-shootout-audio.s3.eu-west-2.amazonaws.com \
          --build-arg NEXT_PUBLIC_TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }} \
          --build-arg NEXT_PUBLIC_TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }} \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
          .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
