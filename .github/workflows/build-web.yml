name: Build and Push Web

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: persian-tts-shootout

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      working-directory: web
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build \
          --platform linux/amd64 \
          --build-arg NEXT_PUBLIC_AUDIO_BASE_URL=https://persian-tts-shootout-audio.s3.eu-west-2.amazonaws.com \
          --build-arg NEXT_PUBLIC_TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }} \
          --build-arg NEXT_PUBLIC_TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }} \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
